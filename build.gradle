plugins {
    id 'java' // Applies the Java plugin
    id 'application' // Applies the Application plugin for runnable JARs
}

group 'com.src' // Your project's group ID
version '0.1.0' // Your project's version

repositories {
    mavenCentral() // Specifies Maven Central as a dependency repository
}

dependencies {
// https://mvnrepository.com/artifact/org.sejda.webp-imageio/webp-imageio-sejda
    implementation("org.sejda.webp-imageio:webp-imageio-sejda:0.1.0")
}

application {
    mainClass = 'com.sfcalc.Main' // Define the main class for your application
}
jar {
    manifest {
        attributes 'Main-Class': 'com.sfcalc.Main'
    }
}
